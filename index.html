<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="results-container">
    
    <section class="result-card">
      <h1 class="card-title">Your Result</h1>
      
      <div class="score-circle">
        <span class="score-number">76</span>
        <span class="score-total">of 100</span>
      </div>

      <div class="result-feedback">
        <h2 class="feedback-title">Great</h2>
        <p class="feedback-desc">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
    </section>

    <section class="summary-card">
      <h2 class="card-title">Summary</h2>

      <div class="summary-items" id="summary-items"></div>

      <button class="btn-continue">Continue</button>
    </section>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/rarifingerstyle-svg">rarifingerstyle-svg</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
